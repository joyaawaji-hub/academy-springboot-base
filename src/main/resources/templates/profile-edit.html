<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介編集 | My Portfolio</title>
    <link rel="stylesheet" th:href="@{/css/profile-edit.css}">
</head>

<body>

<header class="header">
    <div class="header-inner">
        <h1 class="logo">
            <a th:href="@{/top}" class="logo-link">My Portfolio</a>
        </h1>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-button">
                ログアウト
            </button>
        </form>
    </div>
</header>


<main class="main">

    <h2 class="page-title">
        自己紹介を編集する
    </h2>

    <form
        th:action="@{/profile/edit}"
        th:object="${profileForm}"
        method="post"
        enctype="multipart/form-data"
        class="profile-form"
    >

        <input
            type="hidden"
            th:field="*{retainedAvatarFileName}"
        >

        <input
            type="hidden"
            th:field="*{retainedAvatarOriginalName}"
        >


        <div class="form-group introduction-group">

            <label
                for="selfIntroduction"
                class="form-label"
            >
                自己紹介文
            </label>

            <textarea
                id="selfIntroduction"
                th:field="*{selfIntroduction}"
                class="introduction-textarea"
            ></textarea>

            <p
                class="validation-error"
                th:if="${#fields.hasErrors('selfIntroduction')}"
                th:errors="*{selfIntroduction}"
            ></p>

        </div>


        <div class="form-group avatar-group">

            <p class="form-label">
                アバター画像
            </p>

            <input
                type="file"
                id="avatarImage"
                name="avatarImage"
                accept="image/*"
                class="avatar-input"
            >

            <label
                for="avatarImage"
                class="file-select-button"
            >
                画像ファイルを添付する
            </label>

            <p
                id="fileStatus"
                class="file-status"
                th:text="${profileForm.retainedAvatarOriginalName != null and !#strings.isEmpty(profileForm.retainedAvatarOriginalName)
                    ? '選択済み：' + profileForm.retainedAvatarOriginalName
                    : ''}"
            ></p>

        </div>


        <div class="submit-area">

            <button
                type="submit"
                class="confirm-button"
            >
                自己紹介を確定する
            </button>

        </div>

    </form>

</main>


<footer class="footer">
    portfolio site
</footer>


<script>

    const avatarInput = document.getElementById('avatarImage');
    const fileStatus = document.getElementById('fileStatus');

    avatarInput.addEventListener('change', function () {
        if (this.files && this.files.length > 0) {
            fileStatus.textContent = '選択済み：' + this.files[0].name;
        }
    });
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TOP | My Portfolio</title>

    <link rel="stylesheet" th:href="@{/css/top.css}">
</head>

<body>

<header class="top-header">
    <h1 class="site-title">My Portfolio</h1>

    <a th:href="@{/logout}" class="logout-button">
        ログアウト
    </a>
</header>

<main class="top-container">

    <section class="profile-section">

        <div class="profile-left">

            <div class="avatar-placeholder">
    <img
        th:if="${user != null and user['avatar_image'] != null}"
        th:src="@{'/uploads/' + ${user['avatar_image']}}"
        alt="プロフィール画像"
        class="avatar-image"
    >
</div>

            <p
                class="user-name"
                th:text="${session.loginUserName}"
            ></p>

        </div>

        <div class="profile-right">

            <h2 class="section-title">
                自己紹介
            </h2>

            <p class="introduction-text" th:text="${user != null ? user['self_introduction'] : ''}"></p>

            <a th:href="@{/profile/edit}" class="edit-button">
                自己紹介を編集する
            </a>

        </div>

    </section>

</main>

<footer class="footer">
    <p>portfolio site</p>
</footer>

</body>
</html>

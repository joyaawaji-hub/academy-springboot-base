<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>項目追加 | My Portfolio</title>

    <link rel="stylesheet" th:href="@{/css/learning-add.css}">
</head>

<body class="learning-scale-page">

<header class="header">
    <a th:href="@{/learning}" class="site-title">My Portfolio</a>

    <a th:href="@{/logout}" class="logout-button">
        ログアウト
    </a>
</header>

<main class="add-container">

    <h2 class="page-title">
        <span th:text="${categoryName}"></span>に項目を追加
    </h2>

    <form
        th:action="@{/learning/add(categoryId=${categoryId}, month=${selectedMonth})}"
        th:object="${learningAddForm}"
        method="post"
        class="add-form"
    >

        <div class="form-group">
            <label for="itemName">項目名</label>

            <input
                type="text"
                id="itemName"
                th:field="*{itemName}"
            >

            <p
                class="error-message"
                th:if="${#fields.hasErrors('itemName')}"
                th:errors="*{itemName}"
            ></p>
        </div>

        <div class="form-group">
            <label for="learningHours">学習時間</label>

            <input
                type="text"
                id="learningHours"
                th:field="*{learningHours}"
                inputmode="numeric"
            >

            <p class="help-text">
                分単位で入力してください
            </p>

            <p
                class="error-message"
                th:if="${#fields.hasErrors('learningHours')}"
                th:errors="*{learningHours}"
            ></p>
        </div>

        <button type="submit" class="submit-button">
            追加する
        </button>

    </form>

</main>

<footer class="footer">
    <p>portfolio site</p>
</footer>


<div
    class="modal-overlay"
    th:if="${showSuccessModal}"
>
    <div class="success-modal">

        <p class="success-message">
            <span th:text="${categoryName}"></span>に
            <span th:text="${registeredItemName}"></span>を
            <br>
            <span th:text="${registeredLearningHours}"></span>分追加しました！
        </p>

        <a
            th:href="@{/learning(month=${selectedMonth})}"
            class="back-button"
        >
            編集ページに戻る
        </a>

    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン | My Portfolio</title>

    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<header class="header">
    <h1 class="site-title">My Portfolio</h1>
</header>

<main class="login-container">

    <h2 class="page-title">ログイン</h2>

    <form
        class="login-form"
        th:action="@{/login}"
        th:object="${loginForm}"
        method="post"
    >

        <div
            class="error-message"
            th:if="${loginError}"
            th:text="${loginError}"
        ></div>

        <div class="form-group">
            <label for="email">
                メールアドレス
            </label>

            <input
                type="email"
                id="email"
                th:field="*{email}"
                autocomplete="email"
            >
        </div>

        <div class="form-group">
            <label for="password">
                パスワード
            </label>

            <input
                type="password"
                id="password"
                th:field="*{password}"
                autocomplete="current-password"
            >
        </div>

        <button
            type="submit"
            class="login-button"
        >
            ログインする
        </button>

        <a
            th:href="@{/register}"
            class="register-button"
        >
            新規登録する
        </a>

    </form>

</main>

<footer class="footer">
    <p>Portfolio site</p>
</footer>


</body>
</html>
